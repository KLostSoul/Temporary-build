name: Build BongoCat Live2D OBS 33 DLL

on:
  push:
    branches: [build/bongocat-obs33]
    paths:
      - 'bongocat_payload.xz.b64'
      - '.github/workflows/build-bongocat-obs33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 v0.6.1 DLL and two install ZIP layouts
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact submitted source
        shell: pwsh
        run: |
          python -c "import pathlib,base64,lzma,io,tarfile; d=base64.b64decode(pathlib.Path('bongocat_payload.xz.b64').read_text()); tarfile.open(fileobj=io.BytesIO(lzma.decompress(d)),mode='r:').extractall('plugin')"
          if (-not (Test-Path plugin/tools/build_windows.ps1)) { throw 'Payload failed to unpack' }
          Write-Host 'SOURCE_PRESERVED: no build-time source patches'
      - name: Verify source contract
        shell: pwsh
        run: python plugin/tests/check_source_contract.py
      - name: Build, test and package with MSVC and Rust
        shell: pwsh
        run: |
          Start-Transcript -Path 'bongocat-build-log.txt' -Force
          try {
            & ./plugin/tools/build_windows.ps1
          } finally {
            Stop-Transcript
          }
      - name: Check actual Windows DLL and ZIP
        shell: pwsh
        run: |
          $dll = 'plugin/build/Release/bongocat-obs.dll'
          $zip = 'plugin/dist/BongoCat_OBS33_Live2D_Windows_x64.zip'
          $legacy = 'plugin/dist/BongoCat_OBS33_Live2D_ProgramFiles_x64.zip'
          if (-not (Test-Path $dll) -or -not (Test-Path $zip) -or -not (Test-Path $legacy)) { throw 'Required outputs missing' }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $legacy))
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            if ($names -notcontains 'obs-plugins/64bit/bongocat-obs.dll') {throw 'Legacy DLL path incorrect'}
            if ($names -notcontains 'data/obs-plugins/bongocat-obs/models/standard/cat.model3.json') {throw 'Legacy model path incorrect'}
            Write-Host 'PROGRAMFILES_LEGACY_INSTALL_LAYOUT_OK'
          } finally { $archive.Dispose() }
          $data=[IO.File]::ReadAllBytes((Resolve-Path $dll))
          if($data[0] -ne 0x4d -or $data[1] -ne 0x5a){throw 'Missing MZ signature'}
          $pe=[BitConverter]::ToInt32($data,0x3c)
          if([BitConverter]::ToUInt16($data,$pe+4) -ne 0x8664){throw 'DLL is not Windows x64'}
          Get-FileHash $dll -Algorithm SHA256 | Format-List
      - name: Upload installable OBS plugin
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat_OBS33_2.4.1_v0.6.1_Windows_x64
          path: plugin/dist/BongoCat_OBS33_Live2D_Windows_x64.zip
          if-no-files-found: error
      - name: Upload OBS Program Files legacy plugin install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat_OBS33_v0.6.1_ProgramFiles_x64
          path: plugin/dist/BongoCat_OBS33_Live2D_ProgramFiles_x64.zip
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat_OBS33_v0.6.1_diagnostics
          path: |
            bongocat-build-log.txt
            plugin/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
