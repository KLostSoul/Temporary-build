name: Build BongoCat Live2D OBS 33 DLL

on:
  push:
    branches: [build/bongocat-obs33]
    paths:
      - 'bongocat_payload.xz.b64'
      - '.github/workflows/build-bongocat-obs33.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 DLL + release ZIP
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Unpack pinned source payload
        shell: pwsh
        run: |
          python -c "import pathlib,base64,lzma,io,tarfile; d=base64.b64decode(pathlib.Path('bongocat_payload.xz.b64').read_text()); tarfile.open(fileobj=io.BytesIO(lzma.decompress(d)),mode='r:').extractall('plugin')"
          if (-not (Test-Path plugin/tools/build_windows.ps1)) { throw 'Payload failed to unpack' }
      - name: Fix OBS 33 SDK install dependencies
        shell: pwsh
        run: |
          $path = 'plugin/tools/build_windows.ps1'
          $script = Get-Content $path -Raw
          $old = "        Exec 'cmake' @('--install',"
          $new = "        Exec 'cmake' @('--build',`$obsBuild,'--target','obs-frontend-api','--config','Release','--parallel','4')`n$old"
          if (-not $script.Contains($old)) { throw 'Expected OBS SDK install command not found' }
          [IO.File]::WriteAllText((Resolve-Path $path), $script.Replace($old, $new))
      - name: Fix Rust ABI defaults and motion index
        shell: pwsh
        run: |
          $path = 'plugin/engine/src/lib.rs'
          $source = [IO.File]::ReadAllText((Resolve-Path $path))
          if (-not $source.Contains('#[derive(Clone, Copy, Default)]')) { throw 'BcInput derive not found' }
          if (-not $source.Contains('pub struct Engine {')) { throw 'Rust engine declaration not found' }
          if (-not $source.Contains('motion_clip(group,index)')) { throw 'Rust motion index site not found' }
          $source = $source.Replace('#[derive(Clone, Copy, Default)]', '#[derive(Clone, Copy)]')
          $impl = "impl Default for BcInput {`n    fn default() -> Self { unsafe { std::mem::zeroed() } }`n}`n`npub struct Engine {"
          $source = $source.Replace('pub struct Engine {', $impl)
          $source = $source.Replace('motion_clip(group,index)', 'motion_clip(group,*index)')
          [IO.File]::WriteAllText((Resolve-Path $path), $source)
      - name: Build and test with Windows MSVC
        shell: pwsh
        run: |
          Start-Transcript -Path 'bongocat-build-log.txt' -Force
          try {
            & ./plugin/tools/build_windows.ps1
          } finally {
            Stop-Transcript
          }
      - name: Verify packaged DLL exists and inspect PE header
        shell: pwsh
        run: |
          $dll = 'plugin/build/Release/bongocat-obs.dll'
          if (-not (Test-Path $dll)) { throw 'DLL was not built' }
          $data = [IO.File]::ReadAllBytes((Resolve-Path $dll))
          if ($data[0] -ne 0x4d -or $data[1] -ne 0x5a) { throw 'Not a PE/DLL' }
          $pe = [BitConverter]::ToInt32($data, 0x3c)
          $machine = [BitConverter]::ToUInt16($data, $pe + 4)
          if ($machine -ne 0x8664) { throw ('Expected x64, got 0x{0:x}' -f $machine) }
          Get-FileHash $dll -Algorithm SHA256 | Format-List
      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat_OBS33_2.4.1_Windows_x64
          path: plugin/dist/BongoCat_OBS33_Live2D_Windows_x64.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BongoCat_OBS33_build_diagnostics
          path: |
            bongocat-build-log.txt
            plugin/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
