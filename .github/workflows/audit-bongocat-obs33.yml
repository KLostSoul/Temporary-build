name: Audit BongoCat OBS 33 v0.4.0 DLL runtime and model switch

on:
  push:
    branches: [build/bongocat-obs33]
    paths: ['.github/workflows/audit-bongocat-obs33.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-dll-load:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BongoCat_OBS33_2.4.1_Windows_x64_v0.4.0
          run-id: 44014402669
          repository: KLostSoul/Temporary-build
          github-token: ${{ github.token }}
          path: release
      - name: Download official OBS 33.0.1 portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip'
          Invoke-WebRequest $uri -OutFile "$env:RUNNER_TEMP\obs.zip"
          Expand-Archive "$env:RUNNER_TEMP\obs.zip" -DestinationPath obs -Force
          Expand-Archive release/BongoCat_OBS33_Live2D_Windows_x64.zip -DestinationPath plugin -Force
      - name: Test native DLL loader against original OBS release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $obs=Get-ChildItem obs -Filter obs.dll -Recurse -File | Select-Object -First 1
          $dll=Get-ChildItem plugin -Filter bongocat-obs.dll -Recurse -File | Select-Object -First 1
          if (-not $obs -or -not $dll) { throw 'DLL files missing' }
          Write-Host "OBS: $($obs.FullName)"
          Write-Host "Plugin: $($dll.FullName)"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Loader {
            [DllImport("kernel32.dll", EntryPoint="SetDllDirectoryW", CharSet=CharSet.Unicode)]
            public static extern bool SetDir(string path);
            [DllImport("kernel32.dll", EntryPoint="LoadLibraryW", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr Load(string path);
            [DllImport("kernel32.dll", EntryPoint="GetProcAddress", CharSet=CharSet.Ansi)]
            public static extern IntPtr Proc(IntPtr handle,string name);
            [DllImport("kernel32.dll")] public static extern bool FreeLibrary(IntPtr handle);
            [UnmanagedFunctionPointer(CallingConvention.Cdecl)] public delegate uint Ver();
          }
          '@
          if (-not [Loader]::SetDir($obs.DirectoryName)) { throw 'SetDllDirectory failed' }
          $obsHandle=[Loader]::Load($obs.FullName)
          if ($obsHandle -eq [IntPtr]::Zero) {throw "obs.dll load failure Win32=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"}
          $pluginHandle=[Loader]::Load($dll.FullName)
          if ($pluginHandle -eq [IntPtr]::Zero) {throw "plugin load failure Win32=$([Runtime.InteropServices.Marshal]::GetLastWin32Error())"}
          foreach($entry in @('obs_module_ver','obs_module_description','obs_module_load','obs_module_set_pointer','obs_module_set_locale')){
            if ([Loader]::Proc($pluginHandle,$entry) -eq [IntPtr]::Zero) { throw "Export missing: $entry" }
          }
          $ver=[Runtime.InteropServices.Marshal]::GetDelegateForFunctionPointer([Loader]::Proc($pluginHandle,'obs_module_ver'), [Loader+Ver])
          if ($ver.Invoke() -eq 0) { throw 'Invalid module version' }
          Write-Host "LOAD_SUCCESS; OBS module ABI=$($ver.Invoke())"
          [Loader]::FreeLibrary($pluginHandle) | Out-Null
          [Loader]::FreeLibrary($obsHandle) | Out-Null
          Write-Host 'Binary load only; not a scene/render test'

      - name: Initialize real libobs and verify BongoCat source registration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $obs=Get-ChildItem obs -Filter obs.dll -Recurse -File | Select-Object -First 1
          $dll=Get-ChildItem plugin -Filter bongocat-obs.dll -Recurse -File | Select-Object -First 1
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ObsHost {
            [DllImport("kernel32.dll", EntryPoint="SetDllDirectoryW",CharSet=CharSet.Unicode)] public static extern bool SetDir(string path);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl,CharSet=CharSet.Ansi)]
            [return:MarshalAs(UnmanagedType.I1)] public static extern bool obs_startup(string locale,IntPtr config,IntPtr store);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl,CharSet=CharSet.Ansi)] public static extern int obs_open_module(out IntPtr module,string path,string data_path);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)]
            [return:MarshalAs(UnmanagedType.I1)] public static extern bool obs_init_module(IntPtr module);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)]
            [return:MarshalAs(UnmanagedType.I1)] public static extern bool obs_enum_input_types(UIntPtr index,out IntPtr id);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern IntPtr obs_source_create(string id, string name, IntPtr settings, IntPtr hotkeys);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern uint obs_source_get_width(IntPtr source);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern uint obs_source_get_height(IntPtr source);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern IntPtr obs_data_create();
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern void obs_data_release(IntPtr settings);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl,CharSet=CharSet.Ansi)] public static extern void obs_data_set_string(IntPtr settings,string name,string value);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl,CharSet=CharSet.Ansi)] public static extern void obs_data_set_int(IntPtr settings,string name,long value);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern void obs_source_update(IntPtr source,IntPtr settings);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern void obs_source_release(IntPtr source);
            [DllImport("obs.dll", CallingConvention=CallingConvention.Cdecl)] public static extern void obs_shutdown();
          }
          '@
          if (-not [ObsHost]::SetDir($obs.DirectoryName)) {throw 'SetDllDirectory failed'}
          if (-not [ObsHost]::obs_startup('en-US',[IntPtr]::Zero,[IntPtr]::Zero)) {throw 'obs_startup failed'}
          try {
            $mod=[IntPtr]::Zero
            $status=[ObsHost]::obs_open_module([ref]$mod,$dll.FullName,(Join-Path $dll.Directory.FullName 'data'))
            if($status -ne 0 -or $mod -eq [IntPtr]::Zero){throw "obs_open_module failed: $status"}
            if(-not [ObsHost]::obs_init_module($mod)){throw 'obs_init_module failed'}
            $found=$false
            for($i=0;$i -lt 256;$i++){
              $id=[IntPtr]::Zero
              if(-not [ObsHost]::obs_enum_input_types([UIntPtr]::new([uint64]$i),[ref]$id)){break}
              if([Runtime.InteropServices.Marshal]::PtrToStringAnsi($id) -eq 'bongocat_obs_live2d'){$found=$true;break}
            }
            if(-not $found){throw 'BongoCat source not registered'}
            Write-Host 'OBS_MODULE_REGISTRATION=SUCCESS source=bongocat_obs_live2d'
            $src=[ObsHost]::obs_source_create('bongocat_obs_live2d','audit-standard',[IntPtr]::Zero,[IntPtr]::Zero)
            if($src -eq [IntPtr]::Zero){throw 'obs_source_create returned null'}
            $width=[ObsHost]::obs_source_get_width($src)
            $height=[ObsHost]::obs_source_get_height($src)
            [ObsHost]::obs_source_release($src)
            if($width -ne 640 -or $height -ne 384){throw "Incorrect defaults: $width x $height"}
            Write-Host "OBS_SOURCE_CREATE_SUCCESS dims=$width x $height"
            foreach ($preset in @('keyboard','gamepad')) {
              $settings=[ObsHost]::obs_data_create()
              if($settings -eq [IntPtr]::Zero){throw "obs_data_create failed for $preset"}
              try {
                [ObsHost]::obs_data_set_string($settings,'preset',$preset)
                $other=[ObsHost]::obs_source_create('bongocat_obs_live2d',"audit-$preset",$settings,[IntPtr]::Zero)
                if($other -eq [IntPtr]::Zero){throw "obs_source_create failed for $preset"}
                try {
                  $w=[ObsHost]::obs_source_get_width($other)
                  $h=[ObsHost]::obs_source_get_height($other)
                  if($w -ne 640 -or $h -ne 384){throw "Unexpected $preset size $w x $h"}
                  [ObsHost]::obs_data_set_string($settings,'model_folder','Z:\\this_model_does_not_exist')
                  [ObsHost]::obs_data_set_int($settings,'width',768)
                  [ObsHost]::obs_source_update($other,$settings)
                  if([ObsHost]::obs_source_get_width($other) -ne 640){throw "Failed model change lost prior size for $preset"}
                  Write-Host "MODEL_SWITCH_RETENTION=SUCCESS preset=$preset"
                } finally { [ObsHost]::obs_source_release($other) }
              } finally { [ObsHost]::obs_data_release($settings) }
            }
            Write-Host 'OBS_SOURCE_MODEL_MATRIX=SUCCESS'
          } finally { [ObsHost]::obs_shutdown() }
