name: Build CSCP 2023-12-31 ePC-8801MA x86 VS2017 15.9.11

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Checkout CSCP source imported from official 2023-12-31.7z
        uses: actions/checkout@v4
        with:
          repository: roytam1/CommonSourceCodeProject
          ref: b6183f5e93307c03ff77a5942dc62cd8cef18b0c
          path: cscp-20231231

      - name: Install Visual Studio 2017 Build Tools 15.9.11
        shell: powershell
        run: |
          choco install visualstudio2017buildtools --version=15.9.11.0 -y --package-parameters "--locale en-US"
          if ($LASTEXITCODE -notin 0,1641,3010) { throw "visualstudio2017buildtools failed: $LASTEXITCODE" }
          choco install visualstudio2017-workload-vctools --version=1.3.2 -y --package-parameters "--includeRecommended"
          if ($LASTEXITCODE -notin 0,1641,3010) { throw "visualstudio2017-workload-vctools failed: $LASTEXITCODE" }
          $vs = 'C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools'
          if (!(Test-Path "$vs\VC\Auxiliary\Build\vcvars32.bat")) { throw 'VS2017 Build Tools vcvars32.bat not found' }
          $tool = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object { $_.Name -like '14.16*' } | Sort-Object Name -Descending | Select-Object -First 1
          if (!$tool) { throw 'MSVC 14.16 toolset not found' }
          Write-Host "MSVC tool directory: $($tool.FullName)"

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'winsdk81-setup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe' -OutFile $sdk
          $log = Join-Path $env:RUNNER_TEMP 'winsdk81-install.log'
          $p = Start-Process -FilePath $sdk -ArgumentList '/Quiet','/NoRestart',"/Log $log" -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) {
            if (Test-Path $log) { Get-Content $log -Tail 150 }
            throw "Windows 8.1 SDK installer failed: $($p.ExitCode)"
          }
          $winh = 'C:\Program Files (x86)\Windows Kits\8.1\Include\um\Windows.h'
          if (!(Test-Path $winh)) { throw 'Windows 8.1 SDK headers not found' }

      - name: Verify source project
        shell: powershell
        run: |
          $proj = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231') -Recurse -Filter 'pc8801ma.vcxproj' | Select-Object -First 1
          if (!$proj) { throw 'pc8801ma.vcxproj not found' }
          $text = Get-Content $proj.FullName -Raw
          if ($text -notmatch '<PlatformToolset>v141</PlatformToolset>') { throw 'Source project does not request v141' }
          if ($text -notmatch '<WindowsTargetPlatformVersion>8\.1</WindowsTargetPlatformVersion>') { throw 'Source project does not request Windows SDK 8.1' }
          "PC8801MA_PROJ=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build original Release Win32 with VS2017 15.9.11
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\VC\Auxiliary\Build\vcvars32.bat"
          where cl
          cl 2>&1
          where link
          link 2>&1
          "C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\MSBuild\15.0\Bin\MSBuild.exe" "%PC8801MA_PROJ%" /m /t:Clean;Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Verify PE32 i386 and Rich build 27051
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231'
          $exe = Get-ChildItem -Path $root -Recurse -Filter 'pc8801ma.exe' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (!$exe) { throw 'pc8801ma.exe not found after build' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          $majorLinker = $bytes[$pe + 26]
          $minorLinker = $bytes[$pe + 27]
          if ($machine -ne 0x014c) { throw 'Not Intel i386' }
          if ($magic -ne 0x010b) { throw 'Not PE32' }
          if ($majorLinker -ne 14 -or $minorLinker -ne 16) { throw "Unexpected linker version $majorLinker.$minorLinker" }

          $rich = -1
          for ($i=0; $i -le $bytes.Length-4; $i++) {
            if ($bytes[$i] -eq 0x52 -and $bytes[$i+1] -eq 0x69 -and $bytes[$i+2] -eq 0x63 -and $bytes[$i+3] -eq 0x68) { $rich=$i; break }
          }
          if ($rich -lt 0) { throw 'Rich header not found' }
          $key = [BitConverter]::ToUInt32($bytes, $rich+4)
          $found27051 = $false
          for ($o=128+16; $o -lt $rich; $o+=8) {
            $compid = [BitConverter]::ToUInt32($bytes,$o) -bxor $key
            $build = $compid -band 0xFFFF
            $prod = ($compid -shr 16) -band 0xFFFF
            $cnt = [BitConverter]::ToUInt32($bytes,$o+4) -bxor $key
            Write-Host "Rich prod=$prod build=$build count=$cnt"
            if ($build -eq 27051) { $found27051 = $true }
          }
          if (!$found27051) { throw 'Rich header does not contain build 27051' }
          Write-Host ("Machine=0x{0:X4} PE=0x{1:X4} Linker={2}.{3} Size={4}" -f $machine,$magic,$majorLinker,$minorLinker,$bytes.Length)
          $dst = Join-Path $env:GITHUB_WORKSPACE 'pc8801ma_20231231_vs2017_15.9.11_sdk81_x86.exe'
          Copy-Item $exe.FullName $dst
          Get-FileHash $dst -Algorithm SHA256

      - name: Upload exact 15.9.11 x86 executable
        uses: actions/upload-artifact@v4
        with:
          name: pc8801ma-20231231-vs2017-15.9.11-sdk81-x86
          path: pc8801ma_20231231_vs2017_15.9.11_sdk81_x86.exe
          if-no-files-found: error
