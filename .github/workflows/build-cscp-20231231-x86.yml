name: Build CSCP 2023-12-31 ePC-8801MA x86 exact 27051

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Checkout CSCP 2023-12-31 source
        uses: actions/checkout@v4
        with:
          repository: roytam1/CommonSourceCodeProject
          ref: b6183f5e93307c03ff77a5942dc62cd8cef18b0c
          path: cscp-20231231

      - name: Install fixed Visual Studio 2022 17.8.3 Build Tools with v141
        shell: powershell
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools_17.8.3_LTSC.exe'
          $uri = 'https://download.visualstudio.microsoft.com/download/pr/63b5064f-af60-4cbe-96cd-a9dd9d41ee3d/436695f5b9083e37a62f63326dd4c2757b5780316f2c7e6ba0fdcee0770bfe67/vs_BuildTools.exe'
          Invoke-WebRequest -Uri $uri -OutFile $bootstrapper
          $installPath = 'C:\VS2022_17.8.3'
          $args = @(
            'install',
            '--installPath', $installPath,
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--includeRecommended',
            '--quiet', '--wait', '--norestart', '--nocache'
          )
          $p = Start-Process -FilePath $bootstrapper -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "VS 17.8.3 fixed bootstrapper failed: $($p.ExitCode)" }
          if (!(Test-Path "$installPath\VC\Auxiliary\Build\vcvars32.bat")) { throw 'fixed VS2022 17.8.3 C++ tools missing' }
          Write-Host 'Installed MSVC directories:'
          Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory | ForEach-Object { Write-Host $_.FullName }
          $tool = Get-ChildItem "$installPath\VC\Tools\MSVC" -Directory | Where-Object { $_.Name -like '14.16*' } | Select-Object -First 1
          if (!$tool) { throw 'fixed VS2022 17.8.3 did not install v141' }
          "VS1783=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "V141DIR=$($tool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require compiler and linker 27051 exactly
        shell: cmd
        run: |
          call "%VS1783%\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16
          echo === CL ===
          cl 2>&1
          cl 2>&1 | findstr /C:"19.16.27051"
          if errorlevel 1 exit /b 51
          echo === LINK ===
          link 2>&1
          link 2>&1 | findstr /C:"14.16.27051"
          if errorlevel 1 exit /b 52

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'winsdk81-setup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe' -OutFile $sdk
          $log = Join-Path $env:RUNNER_TEMP 'winsdk81-install.log'
          $p = Start-Process -FilePath $sdk -ArgumentList '/Quiet','/NoRestart',"/Log $log" -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) {
            if (Test-Path $log) { Get-Content $log -Tail 150 }
            throw "Windows 8.1 SDK installer failed: $($p.ExitCode)"
          }
          if (!(Test-Path 'C:\Program Files (x86)\Windows Kits\8.1\Include\um\Windows.h')) { throw 'Windows 8.1 SDK missing' }

      - name: Verify original project settings
        shell: powershell
        run: |
          $proj = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231') -Recurse -Filter 'pc8801ma.vcxproj' | Select-Object -First 1
          if (!$proj) { throw 'pc8801ma.vcxproj not found' }
          $text = Get-Content $proj.FullName -Raw
          if ($text -notmatch '<PlatformToolset>v141</PlatformToolset>') { throw 'project is not v141' }
          if ($text -notmatch '<WindowsTargetPlatformVersion>8\.1</WindowsTargetPlatformVersion>') { throw 'project is not SDK 8.1' }
          "PC8801MA_PROJ=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build original Release Win32 with 27051
        shell: cmd
        run: |
          call "%VS1783%\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16
          "%VS1783%\MSBuild\Current\Bin\MSBuild.exe" "%PC8801MA_PROJ%" /m /t:Clean;Rebuild /p:Configuration=Release /p:Platform=Win32 /p:VCToolsVersion=14.16.27023 /v:minimal

      - name: Verify output against working binary characteristics
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231'
          $exe = Get-ChildItem -Path $root -Recurse -Filter 'pc8801ma.exe' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (!$exe) { throw 'pc8801ma.exe not found' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          $majorLinker = $bytes[$pe + 26]
          $minorLinker = $bytes[$pe + 27]
          if ($machine -ne 0x014c -or $magic -ne 0x010b) { throw 'output is not PE32 i386' }
          if ($majorLinker -ne 14 -or $minorLinker -ne 16) { throw "linker header is $majorLinker.$minorLinker" }
          if ($bytes.Length -ne 1030144) { throw "size mismatch: $($bytes.Length), expected working binary size 1030144" }

          $rich = -1
          for ($i=0; $i -le [Math]::Min($pe-8,$bytes.Length-8); $i++) {
            if ($bytes[$i] -eq 0x52 -and $bytes[$i+1] -eq 0x69 -and $bytes[$i+2] -eq 0x63 -and $bytes[$i+3] -eq 0x68) { $rich=$i; break }
          }
          if ($rich -lt 0) { throw 'Rich header not found' }
          $key = [BitConverter]::ToUInt32($bytes,$rich+4)
          $found27051 = $false
          for ($o=0x90; $o -lt $rich; $o+=8) {
            $compid = [BitConverter]::ToUInt32($bytes,$o) -bxor $key
            $build = $compid -band 0xFFFF
            $prod = ($compid -shr 16) -band 0xFFFF
            $cnt = [BitConverter]::ToUInt32($bytes,$o+4) -bxor $key
            Write-Host "Rich prod=$prod build=$build count=$cnt"
            if ($build -eq 27051) { $found27051=$true }
          }
          if (!$found27051) { throw 'output Rich header is not build 27051' }

          $dst = Join-Path $env:GITHUB_WORKSPACE 'pc8801ma_20231231_x86_27051.exe'
          Copy-Item $exe.FullName $dst
          Get-FileHash $dst -Algorithm SHA256

      - name: Upload exact 27051 executable
        uses: actions/upload-artifact@v4
        with:
          name: pc8801ma-20231231-x86-27051
          path: pc8801ma_20231231_x86_27051.exe
          if-no-files-found: error
