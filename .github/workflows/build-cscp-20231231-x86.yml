name: Find ePC-8801MA intermediate source match

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-match:
    runs-on: windows-2022
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Checkout full CSCP history
        uses: actions/checkout@v4
        with:
          repository: roytam1/CommonSourceCodeProject
          fetch-depth: 0
          path: cscp-history

      - name: Install fixed VS2022 17.8.3 with exact v141 27051
        shell: powershell
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools_17.8.3.exe'
          $uri = 'https://download.visualstudio.microsoft.com/download/pr/63b5064f-af60-4cbe-96cd-a9dd9d41ee3d/436695f5b9083e37a62f63326dd4c2757b5780316f2c7e6ba0fdcee0770bfe67/vs_BuildTools.exe'
          Invoke-WebRequest -Uri $uri -OutFile $bootstrapper
          $installPath='C:\VS2022_17.8.3'
          $args=@('install','--installPath',$installPath,'--add','Microsoft.VisualStudio.Workload.VCTools','--add','Microsoft.VisualStudio.Component.VC.v141.x86.x64','--includeRecommended','--quiet','--wait','--norestart','--nocache')
          $p=Start-Process -FilePath $bootstrapper -ArgumentList $args -Wait -PassThru
          if($p.ExitCode -notin 0,3010){throw "VS install failed $($p.ExitCode)"}
          "VS1783=$installPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require compiler and linker 27051 exactly
        shell: cmd
        run: |
          call "%VS1783%\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16
          cl 2>&1 | findstr /C:"19.16.27051"
          if errorlevel 1 exit /b 51
          link 2>&1 | findstr /C:"14.16.27051"
          if errorlevel 1 exit /b 52

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk=Join-Path $env:RUNNER_TEMP 'winsdk81-setup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe' -OutFile $sdk
          $p=Start-Process -FilePath $sdk -ArgumentList '/Quiet','/NoRestart' -Wait -PassThru
          if($p.ExitCode -notin 0,3010){throw "SDK 8.1 install failed $($p.ExitCode)"}

      - name: Build source-state variants and compare with known-good executable
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'cscp-history'
          $work='D:\Develop\common\history\source'
          $out=Join-Path $env:GITHUB_WORKSPACE 'source-state-builds'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $sha1216='62b2648030273c436b265a74bba64f93903f05ef'
          $sha1231='b6183f5e93307c03ff77a5942dc62cd8cef18b0c'
          $knownFile='0C248F561ADAD47171005998FE90EE931783A6129C7E3AE5762BC6C40BF366AB'
          $knownText='180A2FECA9FA1E0469194ABB84895100B5F0D242BA239FFD7C94D127C0679667'
          $knownSize=1030144
          $knownEntry=0x73DB5
          $knownTextVS=811392

          $variants=@(
            @{name='1231_full'; base=$sha1231; oldDisk=$false; oldVm=$false},
            @{name='1231_disk1216'; base=$sha1231; oldDisk=$true; oldVm=$false},
            @{name='1231_vm1216'; base=$sha1231; oldDisk=$false; oldVm=$true},
            @{name='1231_disk_vm1216'; base=$sha1231; oldDisk=$true; oldVm=$true},
            @{name='1216_full'; base=$sha1216; oldDisk=$false; oldVm=$false},
            @{name='1216_vm1231'; base=$sha1216; oldDisk=$false; oldVm='new'}
          )

          $rows=@(); $matchFound=$false
          foreach($v in $variants){
            Write-Host "========== VARIANT $($v.name) =========="
            Set-Location $repo
            git reset --hard | Out-Host
            git clean -fdx | Out-Host
            git checkout --force $v.base | Out-Host

            if($v.oldDisk -eq $true){ git checkout $sha1216 -- src/vm/disk.cpp | Out-Host }
            if($v.oldVm -eq $true){ git checkout $sha1216 -- src/vm/vm.h | Out-Host }
            if($v.oldVm -eq 'new'){ git checkout $sha1231 -- src/vm/vm.h | Out-Host }

            if(Test-Path $work){Remove-Item $work -Recurse -Force}
            New-Item -ItemType Directory -Path $work -Force | Out-Null
            robocopy $repo $work /E /COPY:DAT /XD .git /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Host
            $rc=$LASTEXITCODE
            if($rc -gt 7){throw "robocopy failed $rc"}
            $global:LASTEXITCODE=0

            $proj=Join-Path $work 'vc++2017\pc8801ma.vcxproj'
            $cmd='call "'+$env:VS1783+'\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16 && "'+$env:VS1783+'\MSBuild\Current\Bin\MSBuild.exe" "'+$proj+'" /t:clean;rebuild /p:Configuration=Release;Platform="Win32" /p:VCToolsVersion=14.16.27023 /v:minimal'
            cmd.exe /D /S /C $cmd
            if($LASTEXITCODE -ne 0){throw "build failed: $($v.name)"}

            $exe=Join-Path $work 'vc++2017\bin\x86\Release\pc8801ma.exe'
            $b=[IO.File]::ReadAllBytes($exe)
            $pe=[BitConverter]::ToInt32($b,0x3c)
            $entry=[BitConverter]::ToUInt32($b,$pe+40)
            $num=[BitConverter]::ToUInt16($b,$pe+6)
            $optsz=[BitConverter]::ToUInt16($b,$pe+20)
            $sec=$pe+24+$optsz
            $textRaw=0;$textSize=0;$textVS=0
            for($i=0;$i -lt $num;$i++){
              $o=$sec+$i*40
              $n=[Text.Encoding]::ASCII.GetString($b,$o,8).Trim([char]0)
              if($n -eq '.text'){
                $textVS=[BitConverter]::ToUInt32($b,$o+8)
                $textSize=[BitConverter]::ToUInt32($b,$o+16)
                $textRaw=[BitConverter]::ToUInt32($b,$o+20)
              }
            }
            $sha=[Security.Cryptography.SHA256]::Create()
            $textHash=([BitConverter]::ToString($sha.ComputeHash($b,$textRaw,$textSize))).Replace('-','')
            $fileHash=(Get-FileHash $exe -Algorithm SHA256).Hash
            $sizeMatch=($b.Length -eq $knownSize)
            $entryMatch=($entry -eq $knownEntry)
            $textVSMatch=($textVS -eq $knownTextVS)
            $textMatch=($textHash -eq $knownText)
            $fileMatch=($fileHash -eq $knownFile)
            $allMatch=$sizeMatch -and $entryMatch -and $textVSMatch -and $textMatch
            Copy-Item $exe (Join-Path $out ("pc8801ma_{0}_x86.exe" -f $v.name)) -Force
            $rows += [pscustomobject]@{Variant=$v.name;Size=$b.Length;Entry=('0x{0:X}' -f $entry);TextVS=$textVS;TextSHA256=$textHash;FileSHA256=$fileHash;SizeMatch=$sizeMatch;EntryMatch=$entryMatch;TextVSMatch=$textVSMatch;TextMatch=$textMatch;FileMatch=$fileMatch;AllMatch=$allMatch}
            Write-Host ("{0}: SIZE={1} ENTRY=0x{2:X} TEXTVS={3} TEXT={4} MATCH={5}" -f $v.name,$b.Length,$entry,$textVS,$textHash,$allMatch)
            if($allMatch -and !$matchFound){
              Copy-Item $exe (Join-Path $out ("MATCH_pc8801ma_{0}_x86.exe" -f $v.name)) -Force
              $matchFound=$true
              "MATCH_VARIANT=$($v.name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $rows | Export-Csv (Join-Path $out 'comparison.csv') -NoTypeInformation -Encoding UTF8
          $rows | Format-Table -AutoSize | Out-Host
          "MATCH_FOUND=$($matchFound.ToString().ToLower())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload variant builds and report
        uses: actions/upload-artifact@v4
        with:
          name: pc8801ma-source-state-comparison
          path: source-state-builds
          if-no-files-found: error

      - name: Report match status
        shell: powershell
        run: |
          if($env:MATCH_FOUND -eq 'true') { Write-Host "MATCH FOUND: $env:MATCH_VARIANT" }
          else { Write-Host 'No exact match among source-state variants.' }
