name: Build CSCP 2023-12-31 ePC-8801MA x86 exact toolchain

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Checkout CSCP source imported from official 2023-12-31.7z
        uses: actions/checkout@v4
        with:
          repository: roytam1/CommonSourceCodeProject
          ref: b6183f5e93307c03ff77a5942dc62cd8cef18b0c
          path: cscp-20231231

      - name: Install MSVC v141 (VS2017 v14.16)
        shell: powershell
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_enterprise.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_enterprise.exe' -OutFile $bootstrapper
          $args = @(
            'modify',
            '--installPath', 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise',
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--quiet', '--wait', '--norestart', '--force'
          )
          $p = Start-Process -FilePath $bootstrapper -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "VS installer failed: $($p.ExitCode)" }
          $v141 = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC' -Directory | Where-Object { $_.Name -like '14.16*' } | Select-Object -First 1
          if (!$v141) { throw 'MSVC v141 / 14.16 not found after installation' }
          Write-Host "v141 toolset: $($v141.FullName)"

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'winsdk81-setup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe' -OutFile $sdk
          $log = Join-Path $env:RUNNER_TEMP 'winsdk81-install.log'
          $p = Start-Process -FilePath $sdk -ArgumentList '/Quiet','/NoRestart',"/Log $log" -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) {
            if (Test-Path $log) { Get-Content $log -Tail 100 }
            throw "Windows 8.1 SDK installer failed: $($p.ExitCode)"
          }
          $winh = 'C:\Program Files (x86)\Windows Kits\8.1\Include\um\Windows.h'
          if (!(Test-Path $winh)) { throw 'Windows 8.1 SDK headers not found after installation' }
          Write-Host "Windows 8.1 SDK: $winh"

      - name: Verify original project toolchain settings
        shell: powershell
        run: |
          $proj = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231') -Recurse -Filter 'pc8801ma.vcxproj' | Select-Object -First 1
          if (!$proj) { throw 'pc8801ma.vcxproj not found' }
          $text = Get-Content $proj.FullName -Raw
          if ($text -notmatch '<PlatformToolset>v141</PlatformToolset>') { throw 'Original project is not configured for v141' }
          if ($text -notmatch '<WindowsTargetPlatformVersion>8\.1</WindowsTargetPlatformVersion>') { throw 'Original project is not configured for Windows SDK 8.1' }
          "PC8801MA_PROJ=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project: $($proj.FullName)"

      - name: Build original Release Win32 configuration
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16
          where cl
          cl 2>&1 | findstr /C:"Version 19.16"
          msbuild "%PC8801MA_PROJ%" /m /t:Clean;Rebuild /p:Configuration=Release /p:Platform=Win32 /v:minimal

      - name: Verify PE32 i386 and linker 14.16
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231'
          $exe = Get-ChildItem -Path $root -Recurse -Filter 'pc8801ma.exe' | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (!$exe) { throw 'pc8801ma.exe not found after build' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $magic = [BitConverter]::ToUInt16($bytes, $pe + 24)
          $majorLinker = $bytes[$pe + 26]
          $minorLinker = $bytes[$pe + 27]
          Write-Host ("Machine=0x{0:X4} PE=0x{1:X4} Linker={2}.{3} Size={4}" -f $machine,$magic,$majorLinker,$minorLinker,$bytes.Length)
          if ($machine -ne 0x014c) { throw 'Not Intel i386' }
          if ($magic -ne 0x010b) { throw 'Not PE32' }
          if ($majorLinker -ne 14 -or $minorLinker -ne 16) { throw "Unexpected linker version $majorLinker.$minorLinker" }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'pc8801ma_20231231_v141_sdk81_x86.exe'
          Copy-Item $exe.FullName $dst
          Get-FileHash $dst -Algorithm SHA256

      - name: Upload exact-toolchain x86 executable
        uses: actions/upload-artifact@v4
        with:
          name: pc8801ma-20231231-v141-sdk81-x86
          path: pc8801ma_20231231_v141_sdk81_x86.exe
          if-no-files-found: error
