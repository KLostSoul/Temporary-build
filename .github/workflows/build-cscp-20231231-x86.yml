name: Probe CSCP 2023-12-31 x86 exact27051 compiler options

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Checkout CSCP 2023-12-31 source
        uses: actions/checkout@v4
        with:
          repository: roytam1/CommonSourceCodeProject
          ref: b6183f5e93307c03ff77a5942dc62cd8cef18b0c
          path: cscp-20231231

      - name: Install fixed VS2022 17.8.3 with exact v141 27051
        shell: powershell
        run: |
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools_17.8.3.exe'
          $uri = 'https://download.visualstudio.microsoft.com/download/pr/63b5064f-af60-4cbe-96cd-a9dd9d41ee3d/436695f5b9083e37a62f63326dd4c2757b5780316f2c7e6ba0fdcee0770bfe67/vs_BuildTools.exe'
          Invoke-WebRequest -Uri $uri -OutFile $bootstrapper
          $installPath = 'C:\VS2022_17.8.3'
          $args = @('install','--installPath',$installPath,'--add','Microsoft.VisualStudio.Workload.VCTools','--add','Microsoft.VisualStudio.Component.VC.v141.x86.x64','--includeRecommended','--quiet','--wait','--norestart','--nocache')
          $p = Start-Process -FilePath $bootstrapper -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "VS 17.8.3 install failed: $($p.ExitCode)" }
          $tool = "$installPath\VC\Tools\MSVC\14.16.27023"
          if (!(Test-Path "$tool\bin\Hostx86\x86\cl.exe")) { throw 'v141 14.16.27023 missing' }
          "VS1783=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require exact compiler and linker 27051
        shell: cmd
        run: |
          call "%VS1783%\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.16
          cl 2>&1 | findstr /C:"19.16.27051"
          if errorlevel 1 exit /b 51
          link 2>&1 | findstr /C:"14.16.27051"
          if errorlevel 1 exit /b 52

      - name: Install Windows 8.1 SDK
        shell: powershell
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'winsdk81-setup.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe' -OutFile $sdk
          $p = Start-Process -FilePath $sdk -ArgumentList '/Quiet','/NoRestart' -Wait -PassThru
          if ($p.ExitCode -notin 0,3010) { throw "Windows 8.1 SDK installer failed: $($p.ExitCode)" }

      - name: Run compiler option probes against known-good text hash
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'cscp-20231231\vc++2017'
          $msbuild = Join-Path $env:VS1783 'MSBuild\Current\Bin\MSBuild.exe'
          $vcvars = Join-Path $env:VS1783 'VC\Auxiliary\Build\vcvars32.bat'
          $targetHash = '180A2FECA9FA1E0469194ABB84895100B5F0D242BA239FFD7C94D127C0679667'
          $targetEntry = 0x73DB5
          $targetVirtualSize = 811392

          $variants = @(
            @{Name='baseline'; Flags=''},
            @{Name='Oy_minus'; Flags='/Oy-'},
            @{Name='GS_minus'; Flags='/GS-'},
            @{Name='Oi_minus'; Flags='/Oi-'},
            @{Name='Ob1'; Flags='/Ob1'},
            @{Name='Ob0'; Flags='/Ob0'},
            @{Name='favor_size'; Flags='/Os'},
            @{Name='favor_speed'; Flags='/Ot'},
            @{Name='fp_fast'; Flags='/fp:fast'},
            @{Name='fp_strict'; Flags='/fp:strict'},
            @{Name='zc_inline_minus'; Flags='/Zc:inline-'},
            @{Name='gw_on'; Flags='/Gw'},
            @{Name='gw_off'; Flags='/Gw-'},
            @{Name='sdl_on'; Flags='/sdl'},
            @{Name='sdl_off'; Flags='/sdl-'},
            @{Name='volatile_iso'; Flags='/volatile:iso'},
            @{Name='volatile_ms'; Flags='/volatile:ms'}
          )

          $report = @()
          $matched = $false
          foreach ($v in $variants) {
            Write-Host "===== PROBE $($v.Name) FLAGS=[$($v.Flags)] ====="
            $flags = $v.Flags
            $cmd = "call `"$vcvars`" -vcvars_ver=14.16 && set `_CL_=$flags && cd /d `"$source`" && `"$msbuild`" pc8801ma.vcxproj /t:Clean;Rebuild /p:Configuration=Release /p:Platform=Win32 /p:VCToolsVersion=14.16.27023 /m /v:minimal"
            & cmd.exe /d /s /c $cmd
            if ($LASTEXITCODE -ne 0) {
              Write-Host "BUILD_FAILED $($v.Name) rc=$LASTEXITCODE"
              $report += [pscustomobject]@{Name=$v.Name;Flags=$flags;Status='BUILD_FAILED';Size='';Entry='';TextVirtualSize='';TextSHA256=''}
              continue
            }
            $exe = Join-Path $source 'bin\x86\Release\pc8801ma.exe'
            if (!(Test-Path $exe)) { throw "missing output for $($v.Name)" }
            $bytes = [IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes,0x3C)
            $entry = [BitConverter]::ToUInt32($bytes,$pe+40)
            $numSections = [BitConverter]::ToUInt16($bytes,$pe+6)
            $optSize = [BitConverter]::ToUInt16($bytes,$pe+20)
            $sec = $pe + 24 + $optSize
            $textRawPtr=0; $textRawSize=0; $textVirtualSize=0
            for($i=0;$i -lt $numSections;$i++) {
              $o=$sec+$i*40
              $name=[Text.Encoding]::ASCII.GetString($bytes,$o,8).Trim([char]0)
              if($name -eq '.text') {
                $textVirtualSize=[BitConverter]::ToUInt32($bytes,$o+8)
                $textRawSize=[BitConverter]::ToUInt32($bytes,$o+16)
                $textRawPtr=[BitConverter]::ToUInt32($bytes,$o+20)
                break
              }
            }
            $sha=[Security.Cryptography.SHA256]::Create()
            $textHash=([BitConverter]::ToString($sha.ComputeHash($bytes,$textRawPtr,$textRawSize))).Replace('-','')
            $isMatch=($textHash -eq $targetHash)
            $shapeMatch=($entry -eq $targetEntry -and $textVirtualSize -eq $targetVirtualSize)
            Write-Host ("RESULT {0}: Size={1} Entry=0x{2:X} TextVS={3} TextSHA={4} EXACT={5} SHAPE={6}" -f $v.Name,$bytes.Length,$entry,$textVirtualSize,$textHash,$isMatch,$shapeMatch)
            $report += [pscustomobject]@{Name=$v.Name;Flags=$flags;Status='OK';Size=$bytes.Length;Entry=('0x{0:X}' -f $entry);TextVirtualSize=$textVirtualSize;TextSHA256=$textHash;Exact=$isMatch;Shape=$shapeMatch}
            if ($isMatch) {
              Copy-Item $exe (Join-Path $env:GITHUB_WORKSPACE 'pc8801ma_20231231_x86_MATCH.exe') -Force
              $matched=$true
              break
            }
            if ($shapeMatch) {
              Copy-Item $exe (Join-Path $env:GITHUB_WORKSPACE ("candidate_{0}.exe" -f $v.Name)) -Force
            }
          }
          $report | Format-Table -AutoSize | Out-String -Width 240 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'probe-report.txt') | Write-Host
          $report | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'probe-report.json') -Encoding UTF8
          if ($matched) { Write-Host '*** EXACT .TEXT MATCH FOUND ***' } else { Write-Host 'No exact .text match in first probe set.' }

      - name: Upload probe report and candidates
        uses: actions/upload-artifact@v4
        with:
          name: exact27051-option-probe
          path: |
            probe-report.txt
            probe-report.json
            pc8801ma_20231231_x86_MATCH.exe
            candidate_*.exe
          if-no-files-found: warn
